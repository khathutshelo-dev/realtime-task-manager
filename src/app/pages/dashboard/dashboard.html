<div class="dashboard">

  <header class="header">
    <h2> Task Manager Pro</h2>
    <button (click)="logout()">Logout</button>
  </header>

  <div class="card input-card">

    <input
      [(ngModel)]="newTask"
      placeholder="Enter new task..."
      type="text"
    />

    <button (click)="addTask()">Add Task</button>

  </div>

  <div class="tasks">

    <div *ngFor="let task of tasks; let i = index" class="task-card">

      <div class="task-text">
        {{ task.text }}
      </div>

      <div class="task-date">
         {{ task.date }}
      </div>

      <button class="delete" (click)="deleteTask(i)">Delete</button>

    </div>

    <p *ngIf="tasks.length === 0" class="empty">
      No tasks yet. Start adding one 
    </p>

  </div>

</div>
